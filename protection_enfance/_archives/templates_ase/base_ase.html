<!-- templates/protection_enfance/base_ase.html -->
{% extends 'base.html' %}

{% block extra_css %}
<style>
    .sidebar-ase {
        min-height: calc(100vh - 120px);
        background-color: #f8f9fa;
        border-right: 1px solid #dee2e6;
    }
    .bg-ase { background-color: #2c3e50; }
    .stat-card { transition: transform 0.2s; }
    .stat-card:hover { transform: translateY(-2px); }
</style>
{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar spécifique ASE -->
        <div class="col-md-3 col-lg-2 sidebar-ase">
            {% include 'protection_enfance/includes/sidebar_ase.html' %}
        </div>

        <!-- Contenu principal -->
        <div class="col-md-9 col-lg-10">
            {% block content_ase %}
            <!-- Contenu spécifique Protection Enfance -->
            {% endblock %}
        </div>
    </div>
</div>
{% endblock %}
