{% extends "base.html" %}
{% block title %}Prévisualisation AFASE #{{ demande.id }}{% endblock %}
{% block content %}
<div class="container mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold mb-4">Prévisualisation du dossier AFASE</h1>
    <iframe src="data:application/pdf;base64,{{ pdf_data }}" width="100%" height="600px" class="border rounded-lg"></iframe>

    <form method="post" class="mt-6 text-center">
        {% csrf_token %}
        <button type="submit" class="bg-green-600 text-white px-8 py-3 rounded-xl font-bold">
            ✅ Valider définitivement et archiver le PDF
        </button>
        <a href="{% url 'AidFi:afase_detail' demande.id %}" class="ml-4 text-gray-500 underline">Retour</a>
    </form>
</div>
{% endblock %}
