<!-- templates/insertion/_statut_reorientation.html -->
{% with s=d.statut %}<span class="inline-block px-2 py-0.5 rounded text-xs font-semibold
 {% if s == 'BROUILLON' %}bg-gray-100 text-gray-700{% elif s == 'INSCRITE' %}bg-blue-100 text-blue-800{% elif s == 'ACCEPTEE' %}bg-green-100 text-green-800{% elif s == 'REFUSEE' %}bg-red-100 text-red-800{% else %}bg-gray-200 text-gray-600{% endif %}">{{ d.get_statut_display }}</span>{% endwith %}
{% if d.nb_ajournements %}<span class="inline-block px-2 py-0.5 rounded text-xs bg-orange-100 text-orange-800">ajournée {{ d.nb_ajournements }} fois</span>{% endif %}
{% if d.decision and d.statut == 'INSCRITE' %}<span class="inline-block px-2 py-0.5 rounded text-xs bg-indigo-50 text-indigo-800">décision notée : {{ d.get_decision_display|lower }}</span>{% endif %}
