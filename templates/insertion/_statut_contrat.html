<!-- templates/insertion/_statut_contrat.html -->
{% with s=c.statut %}<span class="inline-block px-2 py-0.5 rounded text-xs font-semibold
 {% if s == 'BROUILLON' %}bg-gray-100 text-gray-700{% elif s == 'TRANSMIS' %}bg-blue-100 text-blue-800{% elif s == 'RECU' %}bg-indigo-100 text-indigo-800{% elif s == 'VALIDE' %}bg-green-100 text-green-800{% elif s == 'VALIDE_SAUF_ACTION' %}bg-lime-100 text-lime-800{% elif s == 'AJOURNE' %}bg-orange-100 text-orange-800{% elif s == 'NON_VALIDE' %}bg-red-100 text-red-800{% else %}bg-gray-200 text-gray-500{% endif %}">{{ c.get_statut_display }}</span>{% endwith %}
{% if c.alerte == 'renouveler' %}<span class="inline-block px-2 py-0.5 rounded text-xs font-semibold bg-amber-100 text-amber-800" title="Échéance proche"><i class="fas fa-bell mr-1"></i>à renouveler ({{ c.jours_restants }} j)</span>
{% elif c.alerte == 'expire' %}<span class="inline-block px-2 py-0.5 rounded text-xs font-semibold bg-red-100 text-red-800"><i class="fas fa-hourglass-end mr-1"></i>échu</span>{% endif %}
{% if c.attend_avis_medical and c.statut in 'TRANSMIS RECU' %}<span class="inline-block px-2 py-0.5 rounded text-xs font-semibold bg-purple-100 text-purple-800"><i class="fas fa-user-doctor mr-1"></i>avis médical attendu</span>{% endif %}
