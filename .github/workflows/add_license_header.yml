name: Ajouter l'en-tête de licence

on:
  workflow_dispatch:

jobs:
  add-header:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Ajouter l'en-tête aux fichiers Python
        run: |
          HEADER='# =============================================================================
          # © AGPL3 - CID - Developpeur : Frederic COTTA
          # Assistance technique: les IA et particulièrement DeepSeek 
          # Interdiction de réutilisation commerciale
          # =============================================================================
          
          '
          
          for file in $(find . -name "*.py" -not -path "./.git/*" -not -path "*/migrations/*" -not -path "*/__pycache__/*"); do
            if ! grep -q "© AGPL3" "$file"; then
              echo "$HEADER$(cat "$file")" > "$file"
              echo "✅ $file"
            fi
          done
      
      - name: Commit et push des modifications
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "Ajout en-tête licence AGPL3"
          git push
